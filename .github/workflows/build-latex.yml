name: Build LaTeX PDF

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "article/**"
      - ".github/workflows/build-latex.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "article/**"
      - ".github/workflows/build-latex.yml"

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: article
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: prd-article-pdf
          path: article/build/main.pdf

      - name: Commit built PDF
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build LaTeX PDF"
          file_pattern: article/build/main.pdf
